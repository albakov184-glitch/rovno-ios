<title>Ровно</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS-приложение из трёх экранов (Обзор, Операции, Аналитика). Стеклянные карточки над живым цветным фоном, плавающий таб-бар и кнопка «+», добавление через нижний лист с цифровой клавиатурой */
:root {
  --bg: #eef1f8;
  --fg: #0d0f14;
  --fg-2: #5d6273;
  --fg-3: #8c91a1;
  --glass: rgba(255, 255, 255, .55);
  --glass-strong: rgba(255, 255, 255, .78);
  --glass-soft: rgba(255, 255, 255, .38);
  --stroke: rgba(255, 255, 255, .8);
  --hairline: rgba(20, 24, 40, .08);
  --hi: rgba(255, 255, 255, .9);
  --shade: rgba(30, 40, 80, .10);
  --accent: #0a7cff;
  --income: #13b257;
  --expense: #ff3b30;
  --blob-1: #5b9bff;
  --blob-2: #39dcae;
  --blob-3: #b18cff;
  --blob-4: #ffb88a;
  --scrim: rgba(12, 14, 24, .28);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Onest", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Onest", "Segoe UI", system-ui, sans-serif;
  --spring: cubic-bezier(.2, .9, .25, 1.18);
  --soft-spring: cubic-bezier(.3, 1.25, .5, 1);
  --ease: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #05060a; --fg: #f5f6fa; --fg-2: #a2a7b5; --fg-3: #6e7383;
    --glass: rgba(30, 32, 42, .5); --glass-strong: rgba(40, 42, 54, .78); --glass-soft: rgba(30, 32, 42, .32);
    --stroke: rgba(255, 255, 255, .12); --hairline: rgba(255, 255, 255, .08); --hi: rgba(255, 255, 255, .16);
    --shade: rgba(0, 0, 0, .45); --accent: #2b8fff; --income: #32d65f; --expense: #ff5146;
    --blob-1: #1f4fd1; --blob-2: #0f8f6e; --blob-3: #6a37c9; --blob-4: #a8532a;
    --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #05060a; --fg: #f5f6fa; --fg-2: #a2a7b5; --fg-3: #6e7383;
  --glass: rgba(30, 32, 42, .5); --glass-strong: rgba(40, 42, 54, .78); --glass-soft: rgba(30, 32, 42, .32);
  --stroke: rgba(255, 255, 255, .12); --hairline: rgba(255, 255, 255, .08); --hi: rgba(255, 255, 255, .16);
  --shade: rgba(0, 0, 0, .45); --accent: #2b8fff; --income: #32d65f; --expense: #ff5146;
  --blob-1: #1f4fd1; --blob-2: #0f8f6e; --blob-3: #6a37c9; --blob-4: #a8532a;
  --scrim: rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- living background ---------- */
.bg { position: fixed; inset: -10%; z-index: 0; pointer-events: none; overflow: hidden; }
.bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; will-change: transform; }
.bg i:nth-child(1) { width: 60vmax; height: 60vmax; left: -15vmax; top: -18vmax; background: var(--blob-1); animation: drift1 22s ease-in-out infinite alternate; }
.bg i:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: 10vmax; background: var(--blob-2); animation: drift2 26s ease-in-out infinite alternate; }
.bg i:nth-child(3) { width: 46vmax; height: 46vmax; left: 10vmax; bottom: -20vmax; background: var(--blob-3); animation: drift3 30s ease-in-out infinite alternate; }
.bg i:nth-child(4) { width: 32vmax; height: 32vmax; right: 5vmax; bottom: 5vmax; background: var(--blob-4); opacity: .55; animation: drift1 34s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(14vmax, 10vmax) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-12vmax, 16vmax) scale(.9); } }
@keyframes drift3 { to { transform: translate(10vmax, -14vmax) scale(1.1); } }

/* ---------- glass material ---------- */
.glass {
  position: relative;
  background: var(--glass);
  -webkit-backdrop-filter: blur(30px) saturate(190%);
          backdrop-filter: blur(30px) saturate(190%);
  border: 1px solid var(--stroke);
  box-shadow: inset 0 1px 0 var(--hi), 0 12px 40px var(--shade);
  isolation: isolate;
}
.glass::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(135deg, var(--hi) 0%, transparent 38%, transparent 70%, var(--glass-soft) 100%);
  opacity: .55;
}
.glass.lit::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, -40%), var(--hi), transparent 60%);
  opacity: 0; transition: opacity .4s;
}
.glass.lit:hover::after, .glass.lit.touch::after { opacity: 1; }

.press { transition: transform .35s var(--spring); }
.press:active { transform: scale(.95); }

/* ---------- shell ---------- */
.app {
  position: relative; z-index: 1;
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 120px);
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 6px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
.brand svg { width: 32px; height: 32px; display: block; filter: drop-shadow(0 4px 10px rgba(30, 120, 255, .35)); }
.month-switch { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 999px; }
.month-switch button { border: 0; background: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; }
.month-switch button:disabled { opacity: .3; cursor: default; }
.month-switch svg { width: 16px; height: 16px; }
.month-switch span { min-width: 92px; text-align: center; font-weight: 600; font-size: 14px; text-transform: capitalize; }

.page-title { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: -.035em; margin: 18px 4px 14px; }

/* views */
.views { display: grid; }
.view { grid-area: 1 / 1; display: grid; gap: 16px; align-content: start; min-width: 0; }
.view[hidden] { display: none !important; }
.view.enter { animation: viewIn .55s var(--ease) both; }
.view.leave { animation: viewOut .25s ease both; pointer-events: none; }
@keyframes viewIn { from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(8px); } }
@keyframes viewOut { to { opacity: 0; transform: scale(.98); filter: blur(6px); } }
.stagger > * { animation: rise .7s var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .12s; }
.stagger > *:nth-child(4) { animation-delay: .18s; }
.stagger > *:nth-child(5) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.97); filter: blur(10px); } }

.card { border-radius: 28px; padding: 20px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.sec-h h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
.sec-h .sub { font-size: 13px; color: var(--fg-2); }
.link { border: 0; background: none; color: var(--accent); font-weight: 600; font-size: 15px; padding: 4px 2px; }

/* ---------- hero ---------- */
.hero { border-radius: 32px; padding: 22px; overflow: hidden; display: grid; gap: 18px; }
.hero .sheen {
  position: absolute; inset: 0; pointer-events: none; z-index: -1;
  background: linear-gradient(115deg, transparent 30%, var(--hi) 48%, transparent 62%);
  background-size: 260% 100%; opacity: .5; animation: sheen 7s ease-in-out infinite;
}
@keyframes sheen { 0% { background-position: 120% 0; } 55%, 100% { background-position: -40% 0; } }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.label { font-size: 13px; color: var(--fg-2); font-weight: 500; }
.balance { font-family: var(--font-display); font-weight: 700; font-size: clamp(42px, 12.5vw, 58px); letter-spacing: -.04em; line-height: 1; margin-top: 8px; display: flex; white-space: pre; }
.balance.neg { color: var(--expense); }

/* odometer */
.od { display: inline-block; height: 1em; overflow: hidden; }
.od-col { display: flex; flex-direction: column; transition: transform 1s var(--soft-spring); }
.od-col span { height: 1em; line-height: 1em; display: block; }
.od-s { display: inline-block; }

.ring { width: 64px; height: 64px; position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .track { stroke: var(--hairline); }
.ring .val { stroke: var(--income); transition: stroke-dasharray 1.2s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-content: center; font-size: 14px; font-weight: 700; letter-spacing: -.02em; }
.ring small { position: absolute; left: 50%; top: calc(100% + 4px); transform: translateX(-50%); font-size: 11px; color: var(--fg-2); white-space: nowrap; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { border-radius: 20px; padding: 13px 14px; display: grid; gap: 4px; min-width: 0; background: var(--glass-soft); border: 1px solid var(--stroke); }
.mini .tag { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-2); }
.mini .tag svg { width: 16px; height: 16px; }
.mini .v { font-weight: 650; font-size: 19px; letter-spacing: -.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 13px; color: var(--fg-2); padding: 7px 12px; border-radius: 999px; background: var(--glass-soft); border: 1px solid var(--stroke); }
.chip b { color: var(--fg); font-weight: 650; }

/* ---------- rows ---------- */
.group { border-radius: 24px; overflow: hidden; }
.swipe { position: relative; overflow: hidden; }
.swipe + .swipe::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; height: 1px; background: var(--hairline); z-index: 2; }
.swipe .kill {
  position: absolute; top: 0; right: 0; bottom: 0; width: 88px; border: 0;
  background: var(--expense); color: #fff; font-weight: 600; font-size: 14px;
  display: grid; place-items: center;
  opacity: 0; transition: opacity .2s;
}
.swipe.open .kill, .swipe.dragging .kill { opacity: 1; }
.row {
  position: relative; z-index: 1; width: 100%; border: 0; text-align: left;
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
  padding: 12px 16px; background: var(--glass-strong);
  touch-action: pan-y; transition: transform .45s var(--spring), background .2s;
}
.group.glass .row { background: transparent; }
.swipe.open .row, .swipe.dragging .row { background: var(--glass-strong); }
.swipe.dragging .row { transition: none; }
.row:hover { background: var(--glass-soft); }
.row .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.row .ic svg { width: 20px; height: 20px; }
.row .t { min-width: 0; }
.row .t b { display: block; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t span { font-size: 13px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row .t .demo { display: inline; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); border: 1px solid var(--hairline); border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.row .a { font-weight: 650; letter-spacing: -.01em; }
.row .a.in { color: var(--income); }
.in-list { animation: rise .55s var(--ease) both; }
.day-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--fg-2); padding: 0 6px 8px; font-weight: 500; }
.days { display: grid; gap: 18px; }

/* ---------- operations toolbar ---------- */
.search { display: flex; align-items: center; gap: 10px; border-radius: 16px; padding: 0 14px; height: 46px; }
.search svg { width: 18px; height: 18px; color: var(--fg-3); flex: none; }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; font-size: 16px; }
.search input::placeholder { color: var(--fg-3); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: 14px; padding: 3px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 8px 6px; font-weight: 600; font-size: 14px; border-radius: 11px; color: var(--fg-2); transition: color .3s; }
.seg button[aria-pressed="true"] { color: var(--fg); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; border-radius: 11px; background: var(--glass-strong); box-shadow: 0 3px 10px var(--shade), inset 0 1px 0 var(--hi); transition: transform .5s var(--spring), width .5s var(--spring); }

/* ---------- analytics ---------- */
.donut-wrap { display: grid; grid-template-columns: 170px 1fr; gap: 18px; align-items: center; }
.donut { position: relative; width: 170px; height: 170px; margin: 0 auto; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.donut circle { fill: none; stroke-width: 20; cursor: pointer; transition: stroke-dasharray 1.1s var(--ease), stroke-width .4s var(--spring), opacity .3s; }
.donut circle.track { stroke: var(--hairline); cursor: default; }
.donut.has-sel circle.seg-c { opacity: .3; }
.donut.has-sel circle.seg-c.sel { opacity: 1; stroke-width: 26; }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; padding: 30px; }
.donut .c b { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.donut .c span { font-size: 12px; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend { display: grid; gap: 4px; min-width: 0; }
.legend button { border: 0; background: none; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 7px 10px; border-radius: 12px; text-align: left; transition: background .2s; }
.legend button[aria-pressed="true"] { background: var(--glass-soft); }
.legend .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend .p { color: var(--fg-2); font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

.bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; height: 170px; }
.bar-col { border: 0; background: none; display: grid; grid-template-rows: 1fr auto; gap: 8px; height: 100%; min-width: 0; padding: 6px 0 0; border-radius: 14px; transition: background .25s; }
.bar-col[aria-pressed="true"] { background: var(--glass-soft); }
.bar-pair { display: flex; gap: 4px; align-items: flex-end; justify-content: center; height: 100%; }
.bar-pair i { width: 34%; max-width: 15px; border-radius: 6px 6px 3px 3px; height: 0; transition: height 1s var(--spring); }
.bar-col span { font-size: 11px; color: var(--fg-2); text-align: center; text-transform: capitalize; padding-bottom: 6px; }
.bar-col[aria-pressed="true"] span { color: var(--fg); font-weight: 650; }
.bar-read { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; margin-bottom: 12px; min-height: 20px; }
.bar-read b { font-weight: 650; }

.area { width: 100%; height: 150px; display: block; overflow: visible; }
.area .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.area .grid { stroke: var(--hairline); stroke-width: 1; }
.area text { fill: var(--fg-3); font-size: 10px; font-family: var(--font); }
.area .peak { fill: var(--accent); stroke: var(--glass-strong); stroke-width: 3; }

.top-list { display: grid; gap: 14px; }
.top-item { display: grid; gap: 7px; }
.top-item .h { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.top-item .h span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
.top-item .h b { font-weight: 650; }
.track-bar { height: 8px; border-radius: 999px; background: var(--hairline); overflow: hidden; }
.track-bar i { display: block; height: 100%; width: 0; border-radius: inherit; transition: width 1.1s var(--ease); }

/* ---------- empty ---------- */
.empty { text-align: center; padding: 30px 18px; display: grid; gap: 12px; justify-items: center; }
.empty svg { width: 72px; height: 72px; animation: float 4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px) rotate(-3deg); } }
.empty h3 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
.empty p { margin: 0; color: var(--fg-2); max-width: 34ch; font-size: 15px; }
.btn-soft { border: 1px solid var(--stroke); background: var(--glass-strong); color: var(--accent); font-weight: 600; padding: 11px 18px; border-radius: 999px; }
.note-foot { text-align: center; font-size: 12px; color: var(--fg-3); padding: 4px 0; }

/* ---------- dock ---------- */
.dock {
  position: fixed; z-index: 20; left: 0; right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; justify-content: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.tabbar { pointer-events: auto; position: relative; display: flex; padding: 5px; border-radius: 999px; }
.tabbar button { position: relative; z-index: 1; border: 0; background: none; display: grid; justify-items: center; gap: 2px; padding: 7px 16px; font-size: 11px; font-weight: 600; color: var(--fg-2); border-radius: 999px; transition: color .3s; min-width: 0; }
.tabbar button svg { width: 23px; height: 23px; transition: transform .45s var(--spring); }
.tabbar button[aria-selected="true"] { color: var(--accent); }
.tabbar button[aria-selected="true"] svg { transform: scale(1.08); }
.tabbar .blob { position: absolute; top: 5px; bottom: 5px; left: 0; border-radius: 999px; background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--hi), 0 4px 14px var(--shade); }
.fab {
  pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 0; flex: none;
  display: grid; place-items: center; color: #fff;
  background: radial-gradient(circle at 30% 25%, #6fb2ff, var(--accent) 60%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.6), inset 0 -6px 12px rgba(0,30,90,.25), 0 12px 30px rgba(10,124,255,.45);
  transition: transform .45s var(--spring);
}
.fab svg { width: 26px; height: 26px; transition: transform .5s var(--spring); }
.fab:hover svg { transform: rotate(90deg); }
.fab:active { transform: scale(.88); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; transition: opacity .35s; }
.scrim.on { opacity: 1; }
.sheet {
  position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px;
  border-radius: 34px 34px 0 0; border-bottom: 0;
  background: var(--glass-strong);
  padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(18px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .55s var(--spring);
  display: grid; gap: 14px; max-height: 94%; overflow-y: auto; overscroll-behavior: contain;
}
.sheet.on { transform: translateY(var(--drag, 0px)); }
.sheet.dragging { transition: none; }
.grab-zone { display: grid; gap: 10px; touch-action: none; cursor: grab; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--fg-3); opacity: .45; margin: 0 auto; }
.sheet-h { display: grid; grid-template-columns: 80px 1fr 80px; align-items: center; }
.sheet-h h3 { margin: 0; font-size: 17px; font-weight: 650; text-align: center; }
.sheet-h .link { justify-self: start; }

.amount-view { text-align: center; padding: 4px 0 2px; }
.amount-view .big { font-family: var(--font-display); font-weight: 700; font-size: 54px; letter-spacing: -.045em; line-height: 1.05; display: inline-flex; align-items: baseline; gap: 6px; }
.amount-view .big .cur { font-size: 30px; color: var(--fg-2); }
.amount-view .big.zero .digits { color: var(--fg-3); }
.amount-view .big .digits span { display: inline-block; animation: digitIn .35s var(--spring) both; }
@keyframes digitIn { from { transform: translateY(40%) scale(.6); opacity: 0; } }
.amount-view.shake { animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
.amount-view .caret { display: inline-block; width: 3px; height: .8em; background: var(--accent); border-radius: 2px; margin-left: 2px; animation: blink 1s steps(1) infinite; align-self: center; }
@keyframes blink { 50% { opacity: 0; } }

.cats { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }

.cat .ic { width: 52px; height: 52px; border-radius: 17px; display: grid; place-items: center; color: #fff; transition: transform .45s var(--spring), box-shadow .3s; box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }

.cat[aria-pressed="true"] { color: var(--fg); font-weight: 650; }

.fields { border-radius: 18px; overflow: hidden; background: var(--glass-soft); border: 1px solid var(--stroke); }

.field + .field { border-top: 1px solid var(--hairline); }
.field label { font-size: 15px; color: var(--fg-2); }
.field input { border: 0; background: none; outline: none; font-size: 16px; text-align: right; min-width: 0; width: 100%; }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  height: 50px; border-radius: 16px; border: 1px solid var(--stroke); background: var(--glass-soft);
  font-size: 23px; font-weight: 550; display: grid; place-items: center; position: relative; overflow: hidden;
  transition: transform .3s var(--spring), background .2s;
}
.key:active { transform: scale(.92); background: var(--glass); }
.key svg { width: 24px; height: 24px; }
.ripple { position: absolute; border-radius: 50%; background: var(--hi); transform: scale(0); animation: ripple .55s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

.save {
  border: 0; border-radius: 18px; min-height: 56px; padding: 0 16px;

  background: linear-gradient(180deg, #3d9bff, var(--accent));

.save:active { transform: scale(.96); }

.save .check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .45s .05s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.del { border: 0; border-radius: 18px; padding: 14px; font-weight: 600; font-size: 16px; color: var(--expense); background: var(--glass-soft); transition: background .3s, color .3s; }
.del.arm { background: var(--expense); color: #fff; }
.spark { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 60; }

/* ---------- toast ---------- */
.toast {
  position: fixed; z-index: 70; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px);
  transform: translate(-50%, -160%) scale(.9); transition: transform .55s var(--spring);
  padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600;
  max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 8px;
}
.toast.on { transform: translate(-50%, 0) scale(1); }

/* ---------- splash ---------- */
.splash { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: grid; place-content: center; justify-items: center; gap: 18px; transition: opacity .6s var(--ease), visibility .6s, filter .6s; }
.splash.out { opacity: 0; visibility: hidden; filter: blur(12px); }
.splash .halo { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, var(--blob-1), transparent 65%); opacity: .45; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.15); opacity: .7; } }
.splash svg { position: relative; width: 104px; height: 104px; animation: pop .8s var(--spring) both; filter: drop-shadow(0 18px 30px rgba(30,120,255,.4)); }
.splash .b1 { transform-origin: 26px 50px; animation: grow .9s .3s var(--spring) both; }
.splash .b2 { transform-origin: 26px 70px; animation: grow .9s .45s var(--spring) both; }
.splash .word { position: relative; font-family: var(--font-display); font-weight: 700; font-size: 28px; letter-spacing: -.035em; animation: up .7s .55s var(--ease) both; }
@keyframes pop { from { transform: scale(.4) rotate(-12deg); opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes up { from { transform: translateY(12px); opacity: 0; filter: blur(6px); } }

.skel { height: 72px; border-radius: 24px; background: linear-gradient(90deg, var(--glass-soft) 30%, var(--glass) 50%, var(--glass-soft) 70%); background-size: 300% 100%; animation: shim 1.2s linear infinite; }

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- categories ----------
  const ICONS = {
    food: '<path d="M7 3v8a3 3 0 0 0 6 0V3M10 3v18M17 3c-1.5 1.5-2 4-2 6s1 3 2 3v9"/>',

    health: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
    sub: '<path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/>',
    misc: '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>',
    salary: '<path d="M3 7h18v10H3zM12 9.5v5M10 10.5h3a1 1 0 0 1 0 2h-2a1 1 0 0 0 0 2h3"/>',
    laptop: '<path d="M5 6h14v9H5zM3 18h18"/>',
    gift: '<path d="M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7c-2-3-5-3-5-1s3 1 5 1c2 0 5 1 5-1s-3-2-5 1"/>',
    up: '<path d="M12 19V5M6 11l6-6 6 6"/>'
  };
  const CATS = {
    expense: [
      { id: 'food', name: 'Еда', color: '#ff9f0a' },
      { id: 'car', name: 'Транспорт', color: '#0a84ff' },
      { id: 'home', name: 'Дом', color: '#5e5ce6' },
      { id: 'bag', name: 'Покупки', color: '#ff375f' },
      { id: 'fun', name: 'Отдых', color: '#bf5af2' },
      { id: 'health', name: 'Здоровье', color: '#ff453a' },
      { id: 'sub', name: 'Подписки', color: '#32ade6' },
      { id: 'misc', name: 'Другое', color: '#8e8e93' }
    ],
    income: [
      { id: 'salary', name: 'Зарплата', color: '#30b158' },
      { id: 'laptop', name: 'Фриланс', color: '#14b8a6' },
      { id: 'gift', name: 'Подарки', color: '#ff9f0a' },
      { id: 'up', name: 'Другое', color: '#8e8e93' }
    ]
  };
  const catOf = (type, id) => (CATS[type] || CATS.expense).find(c => c.id === id) || CATS[type === 'income' ? 'income' : 'expense'].slice(-1)[0];
  const icon = id => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[id] + '</svg>';

  // ---------- formatting ----------
  const rub = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  const money = v => rub.format(Math.round(v)) + ' ₽';
  const signed = v => (v < 0 ? '−' : '') + money(Math.abs(v));
  const monthName = new Intl.DateTimeFormat('ru-RU', { month: 'long' });
  const monthShort = new Intl.DateTimeFormat('ru-RU', { month: 'short' });
  const dayFmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayIso = () => iso(new Date());
  const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dative = m => m.replace(/ь$/, 'ю').replace(/й$/, 'ю').replace(/т$/, 'ту');
  const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };

  // ---------- haptics (native app only) ----------
  function haptic(kind) {
    try {
      const H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
      if (!H) return;
      if (kind === 'success') H.notification({ type: 'SUCCESS' });
      else if (kind === 'warn') H.notification({ type: 'WARNING' });
      else H.impact({ style: kind === 'medium' ? 'MEDIUM' : 'LIGHT' });
    } catch (e) {}
  }

  // ---------- state ----------
  let txs = [];
  let ready = false;
  let cursor = new Date(); cursor.setDate(1);
  let store = null;
  let tab = 'overview';
  let filter = 'all';
  let query = '';
  let donutSel = null;
  let barSel = 5;

  const inMonth = d => { const k = ym(d); return txs.filter(t => t.date.slice(0, 7) === k); };
  const sums = list => list.reduce((s, t) => { if (t.type === 'income') s.i += t.amount; else s.e += t.amount; return s; }, { i: 0, e: 0 });

  // ---------- animated numbers ----------
  const shown = new WeakMap();
  function countTo(el, target, fmt) {
    const from = shown.has(el) ? shown.get(el) : 0;
    shown.set(el, target);
    if (reduced() || from === target) { el.textContent = fmt(target); return; }
    const t0 = performance.now(), dur = 800;
    (function step(t) {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      el.textContent = fmt(from + (target - from) * e);
      if (k < 1 && shown.get(el) === target) requestAnimationFrame(step);
    })(t0);
  }
  // rolling digits, like a mechanical counter
  function odometer(el, text) {
    const chars = [...text];
    const mask = chars.map(c => /\d/.test(c) ? 'd' : c).join('');
    if (el.dataset.mask !== mask) {
      el.dataset.mask = mask;
      el.innerHTML = chars.map(c => /\d/.test(c)
        ? '<span class="od"><span class="od-col">' + '0123456789'.split('').map(n => '<span>' + n + '</span>').join('') + '</span></span>'
        : '<span class="od-s">' + esc(c) + '</span>').join('');
    }
    el.setAttribute('aria-label', text);
    const cols = el.querySelectorAll('.od-col');
    const digits = chars.filter(c => /\d/.test(c));
    requestAnimationFrame(() => {
      cols.forEach((col, i) => {
        col.style.transitionDelay = ((cols.length - i) * 45) + 'ms';
        col.style.transform = 'translateY(' + (-Number(digits[i])) + 'em)';
      });
    });
  }

  // ---------- render ----------
  function render() {
    const now = new Date();
    const isCur = ym(cursor) === ym(now);
    const name = monthName.format(cursor);
    $('monthLabel').textContent = name + (cursor.getFullYear() !== now.getFullYear() ? ' ' + String(cursor.getFullYear()).slice(2) : '');
    $('nextM').disabled = isCur;
    renderOverview(isCur, name);
    renderOps();
    renderAnalytics();
  }

  function renderOverview(isCur, name) {
    const m = inMonth(cursor);
    const { i, e } = sums(m);
    $('balLabel').textContent = 'Остаток за ' + name;
    odometer($('balance'), signed(i - e));
    $('balance').classList.toggle('neg', i - e < 0);
    countTo($('inc'), i, money);
    countTo($('exp'), e, money);
    const rate = i ? Math.max(0, Math.round((i - e) / i * 100)) : 0;
    const C = 2 * Math.PI * 27;
    requestAnimationFrame(() => { $('ringVal').style.strokeDasharray = (C * rate / 100) + ' ' + C; });
    countTo($('ringPct'), rate, v => Math.round(v) + '%');

    const now = new Date();
    const days = isCur ? now.getDate() : new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
    const prev = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1);
    const pe = sums(inMonth(prev)).e;
    const facts = [];
    if (e) facts.push('<span class="chip">В день <b class="num">' + money(e / days) + '</b></span>');
    if (pe && e) {
      const d = Math.round((e - pe) / pe * 100);
      facts.push('<span class="chip">К ' + dative(monthName.format(prev)) + ' <b class="num" style="color:var(' + (d > 0 ? '--expense' : '--income') + ')">' + (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d) + '%</b></span>');
    }
    if (m.length) facts.push('<span class="chip"><b class="num">' + m.length + '</b> ' + plural(m.length, 'операция', 'операции', 'операций') + '</span>');
    $('facts').innerHTML = facts.join('');
    $('facts').hidden = !facts.length;

    // recent
    const recent = $('recent');
    if (!ready) recent.innerHTML = '<div class="skel"></div>';
    else if (!txs.length) recent.innerHTML = emptyState();
    else {
      const last = txs.slice().sort((a, b) => (b.date + pad13(b.createdAt)).localeCompare(a.date + pad13(a.createdAt))).slice(0, 5);
      recent.innerHTML = '<div class="group glass">' + last.map((t, k) => rowHtml(t, k, true)).join('') + '</div>';
    }
    bindRows(recent);
    const demo = $('demoBtn'); if (demo) demo.onclick = fillDemo;

    // top categories
    const by = {};
    m.filter(t => t.type === 'expense').forEach(t => { by[t.category] = (by[t.category] || 0) + t.amount; });
    const top = Object.entries(by).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const tc = $('topCard');
    if (!top.length) { tc.innerHTML = '<p style="margin:0;color:var(--fg-2);text-align:center">Расходов за этот месяц пока нет.</p>'; return; }
    tc.innerHTML = '<div class="top-list">' + top.map(([id, v]) => {
      const c = catOf('expense', id);
      return '<div class="top-item"><div class="h"><span><i class="dot" style="background:' + c.color + '"></i>' + c.name + '</span><b class="num">' + money(v) + '</b></div>' +
        '<div class="track-bar"><i style="background:' + c.color + '" data-w="' + (v / e * 100) + '"></i></div></div>';
    }).join('') + '</div>';
    growBars(tc);
  }
  const pad13 = n => String(n || 0).padStart(13, '0');
  function growBars(root) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      root.querySelectorAll('[data-w]').forEach(b => { b.style.width = b.dataset.w + '%'; });
      root.querySelectorAll('[data-h]').forEach(b => { b.style.height = b.dataset.h + '%'; });
    }));
  }

  function emptyState() {
    return '<div class="card glass empty">' +
      '<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lgE" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f8cff"/><stop offset="1" stop-color="#22c995"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#lgE)" opacity=".9"/><rect x="22" y="38" width="56" height="10" rx="5" fill="#fff"/><rect x="22" y="56" width="40" height="10" rx="5" fill="#fff" opacity=".78"/></svg>' +
      '<h3>Пока пусто</h3><p>Нажмите «+», чтобы записать первый доход или расход. Или посмотрите, как всё выглядит на примере.</p>' +
      '<button class="btn-soft press" type="button" id="demoBtn">Заполнить примерами</button></div>';
  }

  function rowHtml(t, k, plain) {
    const c = catOf(t.type, t.category);
    return '<div class="swipe in-list" style="animation-delay:' + Math.min(k * 40, 480) + 'ms" data-id="' + esc(t.id) + '">' +
      (plain ? '' : '<button type="button" class="kill" tabindex="-1">Удалить</button>') +
      '<button type="button" class="row">' +
      '<span class="ic" style="background:' + c.color + '">' + icon(c.id) + '</span>' +
      '<span class="t"><b>' + esc(t.note || c.name) + (t.demo ? '<span class="demo">пример</span>' : '') + '</b><span>' + c.name + (plain ? ' · ' + shortDay(t.date) : '') + '</span></span>' +
      '<span class="a num' + (t.type === 'income' ? ' in' : '') + '">' + (t.type === 'income' ? '+' : '−') + money(t.amount) + '</span></button></div>';
  }
  function shortDay(s) {
    const lbl = dayLabel(s);
    return lbl.replace(/^[а-я]{2}, /, '');
  }
  function dayLabel(s) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (s === todayIso()) return 'Сегодня';
    if (s === iso(y)) return 'Вчера';
    const [Y, M, D] = s.split('-').map(Number);
    return dayFmt.format(new Date(Y, M - 1, D));
  }

  function renderOps() {
    const el = $('opsList');
    if (!ready) { el.innerHTML = '<div class="skel"></div>'; return; }
    if (!txs.length) { el.innerHTML = emptyState(); const b = $('opsList').querySelector('#demoBtn'); if (b) b.onclick = fillDemo; return; }
    const q = query.trim().toLowerCase();
    const list = inMonth(cursor).filter(t =>
      (filter === 'all' || t.type === filter) &&
      (!q || (t.note || '').toLowerCase().includes(q) || catOf(t.type, t.category).name.toLowerCase().includes(q)));
    if (!list.length) {
      el.innerHTML = '<div class="card glass empty"><p>' + (q || filter !== 'all' ? 'Ничего не найдено.' : 'В этом месяце операций нет.') + '</p></div>';
      return;
    }
    const days = {};
    list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).forEach(t => { (days[t.date] = days[t.date] || []).push(t); });
    let n = 0;
    el.innerHTML = '<div class="days">' + Object.keys(days).sort().reverse().map(d => {
      const net = days[d].reduce((s, t) => s + (t.type === 'income' ? t.amount : -t.amount), 0);
      return '<div><div class="day-h"><span>' + dayLabel(d) + '</span><span class="num">' + (net > 0 ? '+' : '') + signed(net) + '</span></div>' +
        '<div class="group glass">' + days[d].map(t => rowHtml(t, n++, false)).join('') + '</div></div>';
    }).join('') + '</div>' +
      (txs.some(t => t.demo) ? '<div style="text-align:center;margin-top:16px"><button class="btn-soft press" type="button" id="clearDemo">Убрать примеры</button></div>' : '');
    bindRows(el);
    const cd = $('clearDemo'); if (cd) cd.onclick = clearDemo;
  }

  // ---------- rows: tap to edit, swipe left to delete ----------
  function bindRows(root) {
    root.querySelectorAll('.swipe').forEach(sw => {
      const row = sw.querySelector('.row');
      const kill = sw.querySelector('.kill');
      const id = sw.dataset.id;
      let x0 = null, y0 = 0, dx = 0, drag = false, moved = false, base = 0;
      row.addEventListener('click', e => {
        if (moved) { e.preventDefault(); moved = false; return; }
        if (sw.classList.contains('open')) { closeSwipe(sw); return; }
        haptic('light');
        openSheet(txs.find(t => t.id === id));
      });
      if (!kill) return;
      kill.onclick = async () => {
        haptic('medium');
        sw.style.transition = 'height .35s var(--ease), opacity .3s';
        sw.style.height = sw.offsetHeight + 'px';
        requestAnimationFrame(() => { sw.style.height = '0px'; sw.style.opacity = '0'; });
        try { await store.remove(id); toast('Операция удалена', 'trash'); }
        catch (e) { toast('Не получилось удалить'); render(); }
      };
      row.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        x0 = e.clientX; y0 = e.clientY; dx = 0; drag = false; moved = false;
        base = sw.classList.contains('open') ? -88 : 0;
      });
      row.addEventListener('pointermove', e => {
        if (x0 === null) return;
        if (e.pointerType === 'mouse' && e.buttons === 0) return;
        const mx = e.clientX - x0, my = e.clientY - y0;
        if (!drag && Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) {
          drag = true; moved = true; sw.classList.add('dragging');
          root.querySelectorAll('.swipe.open').forEach(o => { if (o !== sw) closeSwipe(o); });
          try { row.setPointerCapture(e.pointerId); } catch (err) {}
        }
        if (!drag) return;
        dx = Math.min(0, Math.max(-140, base + mx));
        if (dx < -88) dx = -88 + (dx + 88) * .35;
        row.style.transform = 'translateX(' + dx + 'px)';
      });
      const end = () => {
        if (!drag) { x0 = null; return; }
        sw.classList.remove('dragging');
        if (dx < -48) { sw.classList.add('open'); row.style.transform = 'translateX(-88px)'; haptic('light'); }
        else closeSwipe(sw);
        drag = false; x0 = null;
        setTimeout(() => { moved = false; }, 50);
      };
      row.addEventListener('pointerup', end);
      row.addEventListener('pointercancel', end);
    });
  }
  function closeSwipe(sw) { sw.classList.remove('open'); const r = sw.querySelector('.row'); if (r) r.style.transform = ''; }

  // ---------- analytics ----------
  function renderAnalytics() {
    const m = inMonth(cursor);
    const e = sums(m).e;
    renderDonut(m, e);
    renderArea(m);
    renderBars();
  }

  function renderDonut(m, total) {
    const box = $('donutBox');
    const by = {};
    m.filter(t => t.type === 'expense').forEach(t => { by[t.category] = (by[t.category] || 0) + t.amount; });
    const parts = Object.entries(by).sort((a, b) => b[1] - a[1]);
    $('donutSub').textContent = parts.length ? parts.length + ' ' + plural(parts.length, 'категория', 'категории', 'категорий') : '';
    if (!parts.length) { box.innerHTML = '<p style="margin:0;color:var(--fg-2);text-align:center">Расходов за этот месяц пока нет.</p>'; return; }
    if (donutSel && !by[donutSel]) donutSel = null;
    const R = 64, C = 2 * Math.PI * R, gap = parts.length > 1 ? 3 : 0;
    let acc = 0;
    const segs = parts.map(([id, v]) => {
      const s = { id, v, color: catOf('expense', id).color, len: Math.max(.5, v / total * C - gap), off: -acc };
      acc += v / total * C; return s;
    });
    const center = s => s
      ? '<b class="num">' + money(s.v) + '</b><span>' + catOf('expense', s.id).name + ' · ' + Math.round(s.v / total * 100) + '%</span>'
      : '<b class="num">' + money(total) + '</b><span>все расходы</span>';
    const sel = segs.find(s => s.id === donutSel);
    box.innerHTML =
      '<div class="donut-wrap"><div class="donut' + (sel ? ' has-sel' : '') + '"><svg viewBox="0 0 170 170">' +
      '<circle class="track" cx="85" cy="85" r="' + R + '"></circle>' +
      segs.map(s => '<circle class="seg-c' + (s.id === donutSel ? ' sel' : '') + '" data-cat="' + s.id + '" cx="85" cy="85" r="' + R + '" style="stroke:' + s.color + ';stroke-dasharray:0 ' + C + ';stroke-dashoffset:' + s.off + '" data-len="' + s.len + '"><title>' + catOf('expense', s.id).name + '</title></circle>').join('') +
      '</svg><div class="c">' + center(sel) + '</div></div>' +
      '<div class="legend">' + segs.map(s => {
        const c = catOf('expense', s.id);
        return '<button type="button" data-cat="' + s.id + '" aria-pressed="' + (s.id === donutSel) + '"><i class="dot" style="background:' + c.color + '"></i><span class="n">' + c.name + '</span><span class="p num">' + Math.round(s.v / total * 100) + '%</span></button>';
      }).join('') + '</div></div>';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      box.querySelectorAll('circle[data-len]').forEach(c => { c.style.strokeDasharray = c.dataset.len + ' ' + C; });
    }));
    box.querySelectorAll('[data-cat]').forEach(el => {
      el.addEventListener('click', () => {
        haptic('light');
        donutSel = donutSel === el.dataset.cat ? null : el.dataset.cat;
        // update in place so the ring does not redraw from zero
        const d = box.querySelector('.donut');
        d.classList.toggle('has-sel', !!donutSel);
        box.querySelectorAll('circle.seg-c').forEach(c => c.classList.toggle('sel', c.dataset.cat === donutSel));
        box.querySelectorAll('.legend button').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === donutSel));
        d.querySelector('.c').innerHTML = center(segs.find(x => x.id === donutSel));
      });
    });
  }

  function renderArea(m) {
    const box = $('areaBox');
    const nDays = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate();
    const now = new Date();
    const lastDay = ym(cursor) === ym(now) ? now.getDate() : nDays;
    const per = Array(nDays).fill(0);
    m.filter(t => t.type === 'expense').forEach(t => { const d = Number(t.date.slice(8, 10)); if (d >= 1 && d <= nDays) per[d - 1] += t.amount; });
    const vals = per.slice(0, Math.max(2, lastDay));
    const max = Math.max(...vals, 0);
    if (!max) { $('areaSub').textContent = ''; box.innerHTML = '<p style="margin:0;color:var(--fg-2);text-align:center">Здесь появится график, когда будут расходы.</p>'; return; }
    const peakI = vals.indexOf(max);
    $('areaSub').textContent = 'больше всего ' + (peakI + 1) + ' числа';
    const W = 320, H = 130, top = 16, bottom = 18, left = 4, right = 4;
    const x = i => left + i / (nDays - 1) * (W - left - right);
    const y = v => top + (1 - v / max) * (H - top - bottom);
    const pts = vals.map((v, i) => [x(i), y(v)]);
    let d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (let i = 1; i < pts.length; i++) {
      const p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p2 = pts[i], p3 = pts[i + 1] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, Math.min(H - bottom, p1[1] + (p2[1] - p0[1]) / 6)];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, Math.min(H - bottom, p2[1] - (p3[1] - p1[1]) / 6)];
      d += ' C' + c1.join(',') + ' ' + c2.join(',') + ' ' + p2.join(',');
    }
    const area = d + ' L' + pts[pts.length - 1][0] + ',' + (H - bottom) + ' L' + pts[0][0] + ',' + (H - bottom) + ' Z';
    const ticks = [1, Math.ceil(nDays / 2), nDays];
    box.innerHTML = '<svg class="area" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Расходы по дням месяца, максимум ' + money(max) + '">' +
      '<defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
      '<line class="grid" x1="0" x2="' + W + '" y1="' + (H - bottom) + '" y2="' + (H - bottom) + '"/>' +
      '<line class="grid" x1="0" x2="' + W + '" y1="' + top + '" y2="' + top + '" stroke-dasharray="3 4"/>' +
      '<path d="' + area + '" fill="url(#areaG)" class="area-fill" style="opacity:0;transition:opacity 1s .4s"/>' +
      '<path d="' + d + '" class="line"/>' +
      '<circle class="peak" cx="' + pts[peakI][0] + '" cy="' + pts[peakI][1] + '" r="5" style="opacity:0;transition:opacity .4s 1s"/>' +
      ticks.map(t => '<text x="' + x(t - 1) + '" y="' + (H - 4) + '" text-anchor="' + (t === 1 ? 'start' : t === nDays ? 'end' : 'middle') + '">' + t + '</text>').join('') +
      '<text x="' + (W - 2) + '" y="' + (top - 5) + '" text-anchor="end">' + money(max) + '</text>' +
      '</svg>';
    const line = box.querySelector('.line');
    try {
      const L = line.getTotalLength() + 2;
      line.style.strokeDasharray = L; line.style.strokeDashoffset = L;
      line.getBoundingClientRect();
      line.style.transition = 'stroke-dashoffset 1.4s var(--ease)';
      requestAnimationFrame(() => { line.style.strokeDashoffset = 0; });
    } catch (e) {}
    requestAnimationFrame(() => {
      box.querySelector('.area-fill').style.opacity = 1;
      box.querySelector('.peak').style.opacity = 1;
    });
  }

  function renderBars() {
    const el = $('bars');
    const cols = [];
    for (let k = 5; k >= 0; k--) {
      const d = new Date(cursor.getFullYear(), cursor.getMonth() - k, 1);
      cols.push({ d, ...sums(inMonth(d)) });
    }
    const max = Math.max(1, ...cols.map(c => Math.max(c.i, c.e)));
    el.innerHTML = cols.map((c, k) =>
      '<button type="button" class="bar-col" data-k="' + k + '" aria-pressed="' + (k === barSel) + '" aria-label="' + monthName.format(c.d) + ': доходы ' + money(c.i) + ', расходы ' + money(c.e) + '">' +
      '<span class="bar-pair"><i style="background:var(--income);transition-delay:' + k * 60 + 'ms" data-h="' + (c.i / max * 100) + '"></i>' +
      '<i style="background:var(--expense);transition-delay:' + (k * 60 + 30) + 'ms" data-h="' + (c.e / max * 100) + '"></i></span>' +
      '<span>' + monthShort.format(c.d).replace('.', '') + '</span></button>').join('');
    const read = k => {
      const c = cols[k];
      $('barRead').innerHTML = '<span style="text-transform:capitalize"><b>' + monthName.format(c.d) + '</b></span>' +
        '<span class="num"><span style="color:var(--income)">+' + money(c.i) + '</span> · <span style="color:var(--expense)">−' + money(c.e) + '</span></span>';
    };
    read(barSel);
    el.querySelectorAll('.bar-col').forEach(b => b.onclick = () => {
      haptic('light'); barSel = Number(b.dataset.k);
      el.querySelectorAll('.bar-col').forEach(x => x.setAttribute('aria-pressed', x === b));
      read(barSel);
    });
    growBars(el);
  }

  // ---------- tabs ----------
  const TITLES = { overview: 'Обзор', operations: 'Операции', analytics: 'Аналитика' };
  function moveBlob(animate) {
    const btn = $('tabbar').querySelector('[data-tab="' + tab + '"]');
    const blob = $('tabBlob');
    const x1 = btn.offsetLeft, w1 = btn.offsetWidth;
    const prev = blob.dataset.x ? { x: Number(blob.dataset.x), w: Number(blob.dataset.w) } : null;
    blob.dataset.x = x1; blob.dataset.w = w1;
    blob.style.transform = 'translateX(' + x1 + 'px)'; blob.style.width = w1 + 'px';
    if (!animate || !prev || reduced() || !blob.animate) return;
    // stretch like a drop of liquid, then settle
    const lo = Math.min(prev.x, x1), hi = Math.max(prev.x + prev.w, x1 + w1);
    blob.animate([
      { transform: 'translateX(' + prev.x + 'px) scaleY(1)', width: prev.w + 'px' },
      { transform: 'translateX(' + lo + 'px) scaleY(.84)', width: (hi - lo) + 'px', offset: .42 },
      { transform: 'translateX(' + x1 + 'px) scaleY(1.05)', width: w1 + 'px', offset: .8 },
      { transform: 'translateX(' + x1 + 'px) scaleY(1)', width: w1 + 'px' }
    ], { duration: 560, easing: 'cubic-bezier(.3,.7,.2,1)' });
  }
  function go(name, fromUser) {
    if (!TITLES[name]) name = 'overview';
    const prev = tab;
    tab = name;
    $('tabbar').querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === name));
    moveBlob(fromUser);
    $('pageTitle').textContent = TITLES[name];
    const out = $('v-' + prev), inn = $('v-' + name);
    if (prev !== name && fromUser) {
      haptic('light');
      out.classList.add('leave');
      setTimeout(() => { out.hidden = true; out.classList.remove('leave'); }, 220);
      setTimeout(() => {
        inn.hidden = false; inn.classList.remove('enter'); void inn.offsetWidth; inn.classList.add('enter');
        if (name === 'analytics') renderAnalytics();
        window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
      }, 200);
    } else {
      document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'v-' + name; });
    }
    try { if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  $('tabbar').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(b.dataset.tab, true));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go, true));
  window.addEventListener('resize', () => moveBlob(false));
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== tab && TITLES[h]) go(h, true); });

  // segmented controls with a sliding thumb
  function seg(root, value) {
    const btns = [...root.querySelectorAll('button')];
    const i = Math.max(0, btns.findIndex(b => b.dataset.v === value));
    btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.v === value));
    const th = root.querySelector('.thumb');
    th.style.width = 'calc((100% - 6px) / ' + btns.length + ')';
    th.style.transform = 'translateX(' + (i * 100) + '%)';
  }
  $('filter').querySelectorAll('button').forEach(b => b.onclick = () => { haptic('light'); filter = b.dataset.v; seg($('filter'), filter); renderOps(); });
  $('q').addEventListener('input', e => { query = e.target.value; renderOps(); });

  // glass highlight follows the pointer
  function light(e) {
    const g = e.target.closest && e.target.closest('.glass.lit');
    if (!g) return null;
    const r = g.getBoundingClientRect();
    g.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    g.style.setProperty('--my', (e.clientY - r.top) + 'px');
    return g;
  }
  document.addEventListener('pointermove', light, { passive: true });
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    const g = light(e); if (!g) return;
    g.classList.add('touch'); setTimeout(() => g.classList.remove('touch'), 500);
  }, { passive: true });

  $('prevM').onclick = () => { haptic('light'); cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); donutSel = null; render(); };
  $('nextM').onclick = () => { haptic('light'); cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); donutSel = null; render(); };

  // ---------- sheet ----------
  let editing = null, type = 'expense', cat = 'food', amountStr = '', delArmed = false;
  function drawCats() {
    $('cats').innerHTML = CATS[type].map(c =>
      '<button type="button" class="cat press" aria-pressed="' + (c.id === cat) + '" data-id="' + c.id + '" style="--c:' + c.color + '88">' +
      '<span class="ic" style="background:' + c.color + '">' + icon(c.id) + '</span><span>' + c.name + '</span></button>').join('');
    $('cats').querySelectorAll('.cat').forEach(b => b.onclick = () => {
      haptic('light'); cat = b.dataset.id;
      $('cats').querySelectorAll('.cat').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
  }
  function setType(v) {
    type = v; seg($('typeSeg'), v);
    if (!CATS[v].some(c => c.id === cat)) cat = CATS[v][0].id;
    drawCats();
  }
  $('typeSeg').querySelectorAll('button').forEach(b => b.onclick = () => { haptic('light'); setType(b.dataset.v); });

  function drawAmount(added) {
    const big = $('amountBig');
    const text = amountStr || '0';
    const [intP, frac] = text.split(',');
    const intFmt = intP ? rub.format(Number(intP)) : '0';
    const shownTxt = intFmt + (frac !== undefined ? ',' + frac : '');
    const chars = [...shownTxt];
    $('digits').innerHTML = chars.map((c, i) => '<span' + (added && i === chars.length - 1 ? '' : ' style="animation:none"') + '>' + esc(c) + '</span>').join('');
    big.classList.toggle('zero', !amountStr);
    big.setAttribute('aria-label', 'Сумма ' + shownTxt + ' рублей');
    const len = shownTxt.length;
    big.style.fontSize = len > 10 ? '38px' : len > 8 ? '46px' : '';
  }
  function press(k) {
    if (k === 'back') { amountStr = amountStr.slice(0, -1); haptic('light'); drawAmount(false); return; }
    if (k === ',') { if (amountStr.includes(',')) return bump(); amountStr = (amountStr || '0') + ','; }
    else {
      const [i, f] = amountStr.split(',');
      if (f !== undefined && f.length >= 2) return bump();
      if (f === undefined && (i || '').length >= 9) return bump();
      if (amountStr === '0') amountStr = '';
      amountStr += k;
    }
    haptic('light');
    drawAmount(true);
  }
  function bump() { haptic('warn'); const v = $('amountView'); v.classList.remove('shake'); void v.offsetWidth; v.classList.add('shake'); }
  $('keypad').querySelectorAll('.key').forEach(b => {
    b.addEventListener('pointerdown', e => {
      const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) / 2;
      const rip = document.createElement('span');
      rip.className = 'ripple';
      rip.style.width = rip.style.height = s + 'px';
      rip.style.left = (e.clientX - r.left - s / 2) + 'px';
      rip.style.top = (e.clientY - r.top - s / 2) + 'px';
      b.appendChild(rip); setTimeout(() => rip.remove(), 600);
    });
    b.onclick = () => press(b.dataset.k);
  });
  document.addEventListener('keydown', e => {
    if ($('sheet').hidden) return;
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.target.tagName === 'INPUT') return;
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === ',' || e.key === '.') press(',');
    else if (e.key === 'Backspace') press('back');
    else if (e.key === 'Enter') { e.preventDefault(); $('sheet').requestSubmit(); }
  });

  function openSheet(tx) {
    editing = tx || null; delArmed = false;
    $('sheetTitle').textContent = tx ? 'Операция' : 'Новая операция';
    $('del').hidden = !tx; $('del').classList.remove('arm'); $('del').textContent = 'Удалить операцию';
    $('save').classList.remove('done'); $('save').disabled = false; $('save').textContent = tx ? 'Сохранить изменения' : 'Сохранить';
    cat = tx ? tx.category : (type === 'income' ? 'salary' : 'food');
    setType(tx ? tx.type : type);
    amountStr = tx ? String(tx.amount).replace('.', ',') : '';
    drawAmount(false);
    $('note').value = tx ? tx.note || '' : '';
    $('date').value = tx ? tx.date : todayIso();
    $('sheet').style.setProperty('--drag', '0px');
    $('scrim').hidden = false; $('sheet').hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => { $('scrim').classList.add('on'); $('sheet').classList.add('on'); }));
    const sel = $('cats').querySelector('[aria-pressed="true"]');
    if (sel) setTimeout(() => sel.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }), 400);
  }
  function closeSheet() {
    $('scrim').classList.remove('on'); $('sheet').classList.remove('on');
    $('sheet').style.setProperty('--drag', '0px');
    setTimeout(() => { if (!$('sheet').classList.contains('on')) { $('scrim').hidden = true; $('sheet').hidden = true; } }, 520);
  }
  $('fab').onclick = () => { haptic('medium'); openSheet(null); };
  $('cancel').onclick = closeSheet;
  $('scrim').onclick = closeSheet;

  // drag the sheet down to dismiss
  (function () {
    const zone = $('grab'), sh = $('sheet');
    let y0 = null, dy = 0, t0 = 0;
    zone.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      y0 = e.clientY; dy = 0; t0 = performance.now();
      sh.classList.add('dragging');
      try { zone.setPointerCapture(e.pointerId); } catch (err) {}
    });
    zone.addEventListener('pointermove', e => {
      if (y0 === null) return;
      dy = e.clientY - y0;
      sh.style.setProperty('--drag', (dy > 0 ? dy : dy * .2) + 'px');
      $('scrim').style.opacity = String(Math.max(0, 1 - dy / 400));
    });
    const end = () => {
      if (y0 === null) return;
      sh.classList.remove('dragging');
      $('scrim').style.opacity = '';
      const fast = dy / Math.max(1, performance.now() - t0) > .6;
      if (dy > 140 || (fast && dy > 40)) closeSheet(); else sh.style.setProperty('--drag', '0px');
      y0 = null;
    };
    zone.addEventListener('pointerup', end);
    zone.addEventListener('pointercancel', end);
  })();

  function sparkle(from) {
    if (reduced() || !document.body.animate) return;
    const r = from.getBoundingClientRect();
    const colors = ['#ffd60a', '#32d65f', '#5ac8fa', '#ff9f0a', '#ffffff'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('i');
      s.className = 'spark';
      s.style.background = colors[i % colors.length];
      s.style.left = (r.left + r.width / 2) + 'px';
      s.style.top = (r.top + r.height / 2) + 'px';
      document.body.appendChild(s);
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 90;
      s.animate([
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: 'translate(calc(-50% + ' + Math.cos(a) * d + 'px), calc(-50% + ' + (Math.sin(a) * d - 40) + 'px)) scale(.2)', opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.3,1)' }).onfinish = () => s.remove();
    }
  }

  $('sheet').addEventListener('submit', async e => {
    e.preventDefault();
    const amount = parseFloat((amountStr || '').replace(',', '.'));
    if (!(amount > 0)) { bump(); toast('Введите сумму больше нуля'); return; }
    const data = {
      type, category: cat, amount: Math.round(amount * 100) / 100,
      note: $('note').value.trim().slice(0, 60),
      date: $('date').value || todayIso(),
      createdAt: editing ? editing.createdAt || Date.now() : Date.now()
    };
    if (editing && editing.demo) data.demo = true;
    const btn = $('save');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      if (editing) await store.update(editing.id, data); else await store.add(data);
      haptic('success');
      btn.classList.add('done');
      btn.innerHTML = '<svg class="check" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Сохранено';
      if (type === 'income') sparkle(btn);
      const d = new Date(data.date + 'T00:00');
      if (ym(d) !== ym(cursor)) { cursor = new Date(d.getFullYear(), d.getMonth(), 1); render(); }
      setTimeout(closeSheet, 700);
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Сохранить';
      toast('Не получилось сохранить. Попробуйте ещё раз.');
    }
  });

  $('del').onclick = async () => {
    if (!delArmed) { delArmed = true; haptic('warn'); $('del').classList.add('arm'); $('del').textContent = 'Нажмите ещё раз, чтобы удалить'; return; }
    try { await store.remove(editing.id); haptic('medium'); closeSheet(); toast('Операция удалена', 'trash'); }
    catch (err) { toast('Не получилось удалить. Попробуйте ещё раз.'); }
  };

  let tt;
  function toast(msg, kind) {
    const t = $('toast');
    t.innerHTML = (kind === 'trash' ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--expense)" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>' : '') + '<span></span>';
    t.querySelector('span').textContent = msg;
    t.classList.add('on');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400);
  }

  // ---------- demo data, clearly marked ----------
  async function fillDemo() {
    const now = new Date(), rows = [];
    const plan = [
      ['income', 'salary', 95000, 'Зарплата', 5], ['income', 'laptop', 18000, 'Логотип для кофейни', 18],
      ['expense', 'home', 32000, 'Аренда', 3], ['expense', 'food', 2340, 'Продукты', 1], ['expense', 'food', 860, 'Кофе с друзьями', 0],
      ['expense', 'car', 1450, 'Такси', 2], ['expense', 'sub', 399, 'Музыка', 7], ['expense', 'fun', 2600, 'Кино', 9],
      ['expense', 'bag', 5490, 'Кроссовки', 12], ['expense', 'health', 1800, 'Аптека', 14], ['expense', 'food', 3120, 'Продукты', 6]
    ];
    for (let k = 0; k < 6; k++) {
      plan.forEach(([ty, c, a, note, back], j) => {
        if (k > 0 && j >= 9) return;
        const last = k === 0 ? now.getDate() : 28;
        if (k === 0 && back >= last) return;
        const d = new Date(now.getFullYear(), now.getMonth() - k, Math.max(1, last - back));
        const amt = k === 0 ? a : Math.round(a * (0.8 + ((j * 7 + k * 3) % 5) / 10));
        rows.push({ type: ty, category: c, amount: amt, note, date: iso(d), createdAt: Date.now() - k * 1e8 - j * 1000, demo: true });
      });
    }
    document.querySelectorAll('#demoBtn').forEach(b => { b.disabled = true; b.textContent = 'Добавляю…'; });
    try {
      if (store.addMany) await store.addMany(rows); else for (const r of rows) await store.add(r);
      haptic('success'); toast('Добавлены примеры, убрать их можно в «Операциях»');
    } catch (e) { toast('Не получилось добавить примеры'); render(); }
  }
  async function clearDemo() {
    const ids = txs.filter(t => t.demo).map(t => t.id);
    try {
      if (store.removeMany) await store.removeMany(ids); else for (const id of ids) await store.remove(id);
      haptic('medium'); toast('Примеры убраны');
    } catch (e) { toast('Не получилось убрать примеры'); }
  }

  // ---------- storage: iPhone app, Claude artifact, or this browser ----------
  function hideSplash() { setTimeout(() => $('splash').classList.add('out'), reduced() ? 0 : 1100); }
  function setData(list, note) {
    txs = list.filter(t => t && (t.type === 'income' || t.type === 'expense') && typeof t.amount === 'number' && typeof t.date === 'string');
    ready = true;
    $('storeNote').textContent = note;
    render();
  }

  // whole list kept in one key; memory is the source of truth
  function memoryStore(load, save, note) {
    let list = [];
    const commit = async () => { setData(list.slice(), note); await save(JSON.stringify(list)); };
    const newId = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    store = {
      async add(d) { list.push({ ...d, id: newId() }); await commit(); },
      async addMany(rows) { rows.forEach(d => list.push({ ...d, id: newId() })); await commit(); },
      async update(id, d) { list = list.map(t => t.id === id ? { ...d, id } : t); await commit(); },
      async remove(id) { list = list.filter(t => t.id !== id); await commit(); },
      async removeMany(ids) { const s = new Set(ids); list = list.filter(t => !s.has(t.id)); await commit(); }
    };
    return load().then(raw => {
      try { list = JSON.parse(raw || '[]'); } catch (e) { list = []; }
      if (!Array.isArray(list)) list = [];
      setData(list.slice(), note);
    });
  }

  const KEY = 'rovno.tx.v1';
  function useBrowser() {
    return memoryStore(
      async () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
      async v => { try { localStorage.setItem(KEY, v); } catch (e) {} },
      'Данные хранятся только в этом браузере'
    );
  }

  async function start() {
    const cap = window.Capacitor;
    const P = cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.Preferences;
    if (P) {
      try {
        await memoryStore(
          async () => { const r = await P.get({ key: KEY }); return r && r.value; },
          async v => { await P.set({ key: KEY, value: v }); },
          'Данные хранятся на этом iPhone'
        );
      } catch (e) { await useBrowser(); }
      hideSplash(); return;
    }
    if (!window.claude || !window.claude.use) { await useBrowser(); hideSplash(); return; }
    let settled = false;
    const fallback = async () => { if (settled) return; settled = true; await useBrowser(); hideSplash(); };
    const timer = setTimeout(fallback, 10000);
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (settled) return;
      if (!db || !uid) { clearTimeout(timer); return fallback(); }
      const col = db.collection('data/users/' + uid);
      store = {
        add: d => col.add(d),
        update: (id, d) => col.doc(id).set(d),
        remove: id => col.doc(id).delete()
      };
      col.onSnapshot(snap => {
        if (!settled) { settled = true; clearTimeout(timer); hideSplash(); }
        setData(snap.docs.map(d => ({ id: d.id, ...d.data() })), 'Данные хранятся в вашем аккаунте Claude');
      }, () => {
        if (!settled) { clearTimeout(timer); fallback(); }
        else toast('Нет связи с хранилищем. Изменения могут не сохраниться.');
      });
    } catch (e) { clearTimeout(timer); fallback(); }
  }

  // ---------- boot ----------
  seg($('filter'), filter);
  seg($('typeSeg'), type);
  go((location.hash || '').slice(1) || 'overview', false);
  requestAnimationFrame(() => moveBlob(false));
  render();
  start();
})();
</script>
