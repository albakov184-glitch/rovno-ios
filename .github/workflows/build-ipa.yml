name: Build IPA

# Каждый push в main:
#   1. собирает Rovno-Offline.ipa — всё внутри приложения, работает без интернета;
#   2. собирает Rovno-Online.ipa — при запуске берёт свежую версию с GitHub Pages,
#      без интернета открывает встроенную копию; данные в обоих случаях на iPhone;
#   3. публикует сайт на GitHub Pages (ветка gh-pages);
#   4. выкладывает оба IPA в релиз «latest».
# IPA неподписанные: подпишите своим сертификатом (ESign, Scarlet, Sideloadly, AltStore).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa
  cancel-in-progress: true

env:
  PAGES_URL: https://albakov184-glitch.github.io/rovno-ios/

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Publish site to GitHub Pages
        run: |
          mkdir -p site && cp -R web/. site/
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Сайт из ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # ---------- offline ----------
      - name: Sync iOS project (offline)
        run: npx cap sync ios

      - name: Resolve Swift packages
        timeout-minutes: 12
        run: |
          set -o pipefail
          mkdir -p logs
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App \
            -clonedSourcePackagesDirPath build/spm -skipPackagePluginValidation -skipMacroValidation 2>&1 | tee logs/resolve.log | tail -40

      - name: Build offline app
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/offline -clonedSourcePackagesDirPath build/spm \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee logs/offline.log | grep -E "error:|BUILD|\*\*" | tail -60

      - name: Package Rovno-Offline.ipa
        run: |
          APP=build/offline/Build/Products/Release-iphoneos/App.app
          test -f "$APP/App" || { echo "App.app не собран"; exit 1; }
          mkdir -p pkg-offline/Payload && cp -R "$APP" pkg-offline/Payload/
          (cd pkg-offline && zip -qry ../Rovno-Offline.ipa Payload)

      # ---------- online ----------
      - name: Switch config to online mode
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            c.appId = 'app.rovno.finance.online';
            c.server = { url: process.env.PAGES_URL, errorPath: 'index.html' };
            fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          "
          npx cap sync ios

      - name: Build online app
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/online -clonedSourcePackagesDirPath build/spm \
            -skipPackagePluginValidation -skipMacroValidation \
            PRODUCT_BUNDLE_IDENTIFIER=app.rovno.finance.online \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee logs/online.log | grep -E "error:|BUILD|\*\*" | tail -60

      - name: Package Rovno-Online.ipa
        run: |
          APP=build/online/Build/Products/Release-iphoneos/App.app
          test -f "$APP/App" || { echo "App.app не собран"; exit 1; }
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Ровно Онлайн" "$APP/Info.plist"
          grep -q '"url"' "$APP/capacitor.config.json" || { echo "online config missing"; exit 1; }
          mkdir -p pkg-online/Payload && cp -R "$APP" pkg-online/Payload/
          (cd pkg-online && zip -qry ../Rovno-Online.ipa Payload)
          ls -la *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Rovno-ipa
          path: Rovno-*.ipa
          retention-days: 30

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          NOTES="Ровно ${VER}, сборка ${GITHUB_SHA::7} от $(date -u '+%d.%m.%Y %H:%M') UTC.

          • Rovno-Offline.ipa — работает полностью без интернета.
          • Rovno-Online.ipa — обновляется сама с сайта ${PAGES_URL}, без интернета открывает встроенную копию.

          IPA неподписанные: подпишите своим сертификатом."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Ровно ${VER}" --notes "$NOTES"
            gh release delete-asset latest Rovno.ipa -y 2>/dev/null || true
            gh release upload latest Rovno-Offline.ipa Rovno-Online.ipa --clobber
          else
            gh release create latest Rovno-Offline.ipa Rovno-Online.ipa --title "Ровно ${VER}" --notes "$NOTES" --latest
          fi

      # readable without signing in: logs go to a public release when something fails
      - name: Publish logs on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          for f in resolve offline online; do [ -f logs/$f.log ] && tail -c 300000 logs/$f.log > logs/$f-tail.log; done
          ls logs
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --title "CI logs" --notes "Логи упавших сборок" --prerelease
          gh release upload ci-logs logs/*-tail.log --clobber || true
